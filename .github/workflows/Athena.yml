name: Build OpenWrt PPE-NSS for JDCloud Athena

on:
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击运行
    inputs:
      router_ip:
        description: '路由器后台 IP 地址 (避开光猫 192.168.1.1)'
        required: true
        default: '192.168.2.1'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 释放云端服务器磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: 2. 安装 OpenWrt 编译依赖环境
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget curl

      - name: 3. 克隆 openwrt-ppe-nss 源码与配置软件源
        run: |
          git clone -b ppe-nss --depth 1 https://github.com/JuliusBairaktaris/openwrt-ppe-nss.git openwrt
          cd openwrt
          cp feeds.conf.default feeds.conf
          # 添加作者维护的 nss 固件源
          echo "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;ppe-nss" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4. 修改默认 LAN 网关 IP (避免与光猫冲突)
        working-directory: ./openwrt
        run: |
          # 直接修改源码中的 config_generate 脚本，替换默认的 192.168.1.1
          sed -i "s/192.168.1.1/${{ github.event.inputs.router_ip || '192.168.2.1' }}/g" package/base-files/files/bin/config_generate
          grep -n "${{ github.event.inputs.router_ip || '192.168.2.1' }}" package/base-files/files/bin/config_generate

      - name: 5. 生成京东云雅典娜 (RE-CS-02) 专属编译配置
        working-directory: ./openwrt
        run: |
          # 1. 指定目标架构与机型 (雅典娜代号为 jdcloud_re-cs-02)
          cat << 'EOF' > .config
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          EOF

          # 2. 导入作者预设的 PPE + NSS Wi-Fi 硬件加速核心配置
          cat seeds/qualcommax-nss-wifi.seed >> .config

          # 3. 添加 LuCI 网页后台、中文语言包及常用硬件流控插件
          cat << 'EOF' >> .config
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y
          EOF

          # 补全配置依赖
          make defconfig

      - name: 6. 预下载源码包 (dl)
        working-directory: ./openwrt
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 7. 多线程编译固件
        working-directory: ./openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: 8. 上传编译好的固件到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-PPE-NSS-JDCloud-Athena
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/*jdcloud_re-cs-02*
            openwrt/bin/targets/qualcommax/ipq60xx/sha256sums
          if-no-files-found: error
